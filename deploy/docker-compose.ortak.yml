# ysfdurak.com ortak altyapısında çalıştırma (Caddy aynı "web" ağında; port dışarı açılmaz).
#   cd deploy && sudo docker compose -f docker-compose.ortak.yml up -d --build
# Kurulum betiği: ysfdurak.com/sunucu/kurulum-termin.sh
# Veri birimi yok: sunucu durumsuz, projeler ziyaretçinin tarayıcısında durur (yedeğe eklenecek bir şey yok).
name: termin
services:
  termin:
    build: ..
    container_name: termin
    env_file: ../.env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m          # 500 işlik projede 20.000 tur ~ 60 MB
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

networks:
  web:
    external: true
