# Bağımlılık güncellemeleri: her pazartesi npm, Docker ve GitHub Actions denetlenir.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", timezone: "Europe/Istanbul" }
    open-pull-requests-limit: 5
    groups:
      kucuk-guncellemeler:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", timezone: "Europe/Istanbul" }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", timezone: "Europe/Istanbul" }
    groups:
      kucuk-guncellemeler:
        update-types: ["minor", "patch"]
