name: CI
# Her gönderimde ve PR'de: tip denetimi, çekirdek + sunucu/MCP testleri, derleme, tarayıcı duman testi, npm audit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Tarayıcı duman testi
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          npm run test:e2e
      - name: Bilinen açıklar (yalnız çalışma zamanı bağımlılıkları)
        run: npm audit --omit=dev --audit-level=high
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t termin-test .
      - name: Konteyner sağlık ve başlık denetimi
        run: |
          docker run -d --name t -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges termin-test
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsI http://127.0.0.1:8080/ | grep -i "content-security-policy: default-src 'self'"
          docker exec t id -u | grep -v '^0$'
